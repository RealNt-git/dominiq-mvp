input {
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5000
    codec => json
  }
}

filter {
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
    }
  }
  # Добавляем метку времени, если её нет
  if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
    }
  }
  mutate {
    add_tag => ["dominiq-backend"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "dominiq-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug } # Для отладки, можно убрать
}