###backend/pytest.ini
[pytest]
# Минимальная версия
minversion = 7.0

# Добавляем пути для импортов
pythonpath = .

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Опции по умолчанию
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=3
    --json-report
    --json-report-file=test_report.json
    --cov=app
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml

# Маркеры для тестов
markers =
    api: тесты API-эндпоинтов
    integration: интеграционные тесты
    slow: медленные тесты