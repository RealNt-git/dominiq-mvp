# docker-compose.yml
# версия убрана, так как она устарела
services:
  postgres:
    image: postgres:15
    container_name: dominiq-postgres
    environment:
      POSTGRES_USER: dominiq
      POSTGRES_PASSWORD: dominiq
      POSTGRES_DB: dominiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d      
    restart: unless-stopped
    networks:
      - dominiq-net

  ollama:
    image: ollama/ollama:latest
    container_name: dominiq-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    restart: unless-stopped
    networks:
      - dominiq-net

  backend:
    build: ./backend
    container_name: dominiq-backend
    ports:
      - "8000:8000"
    environment:
      - USE_LANGFLOW=false  # false - используется ollama загрузка базы docker exec -it dominiq-ollama ollama pull phi3:mini или true, если хотите использовать Langflow
      - DATABASE_URL=postgresql://dominiq:dominiq@postgres:5432/dominiq
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=phi3:mini
      - MAX_TOKENS=2048
      - TEMPERATURE=0.3
      - LANGFLOW_API_URL=http://langflow:7860/api/v1
      - LANGFLOW_FLOW_VERIFY_TERM=25e545a4-915c-4fed-8ca1-f49f4d49e2dd
      - LANGFLOW_FLOW_GENERATE_MNEMONIC=9310d119-a3a6-4d16-bd8c-075d00046fee
      - LANGFLOW_FLOW_GENERATE_QUESTIONS=1bc67239-4ff6-449f-b0dd-deebd2fece29
      - LANGFLOW_FLOW_SUGGEST_TOPICS=7de3655a-6996-4305-80f3-5aa6033d69c2
      - LANGFLOW_FLOW_GENERATE_TOPIC_CONTENT=3c6e1d7f-3af9-4c3c-a6bf-e5ce05d76c06
      - LANGFLOW_FLOW_DESCRIBE_TOPIC=cdf0dc55-2c7a-4354-b768-13a723c0cdcb
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - ollama
      - langflow
    restart: unless-stopped
    networks:
      - dominiq-net

  frontend:
    build: ./frontend
    container_name: dominiq-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dominiq-net

  # === Стек мониторинга ===
  prometheus:
    image: prom/prometheus:latest
    container_name: dominiq-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - dominiq-net

  grafana:
    image: grafana/grafana:latest
    container_name: dominiq-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - dominiq-net

  # === Стек логирования (ELK) ===
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: dominiq-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - dominiq-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: dominiq-logstash
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - dominiq-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: dominiq-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - dominiq-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: dominiq-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - dominiq-net
    privileged: true

  langflow:
      image: langflowai/langflow:latest
      container_name: langflow
      depends_on:
        - postgres
      environment:
        - LANGFLOW_DATABASE_URL=postgresql://dominiq:dominiq@postgres:5432/langflow?sslmode=disable
        - LANGFLOW_CONFIG_DIR=/app/langflow-config  # для хранения конфигов
        - LANGFLOW_AUTO_LOGIN=true                  # для удобства разработки
        - LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true   # <-- добавьте эту строку
        - LANGFLOW_AUTH_DISABLED=true
      ports:
        - "7860:7860"  # стандартный порт Langflow UI
      volumes:
        - langflow_data:/app/langflow-config        # том для сохранения конфигураций
      networks:
        - dominiq-net
      user: "1000:1000"  
      restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  langflow_data:

networks:
  dominiq-net:
    driver: bridge