# docker-compose.yml
version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: dominiq-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: dominiq-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./dominiq.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=phi3:mini
      - MAX_TOKENS=2048
      - TEMPERATURE=0.3
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dominiq-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  backend_data: